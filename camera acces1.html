
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Photo App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dbeafe, #fce7f3);
      padding: 20px;
    }

    h2 { color: #312e81; }

    video, canvas, #photo {
      width: 100%;
      max-width: 400px;
      border-radius: 15px;
      margin: 12px auto;
    }

    button {
      padding: 12px 16px;
      margin: 6px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #photo { display: none; }
    canvas { display: none; }
  </style>
</head>

<body>
  <h2>📸 Camera Photo App</h2>
  <p>Allow camera permission to take a photo.</p>

  <button onclick="startCamera()">Open Camera</button>
  <br>

  <video id="video" autoplay playsinline></video>
  <br>

  <button onclick="takePhoto()">📷 Click Photo</button>
  <button onclick="stopCamera()">Stop Camera</button>

  <canvas id="canvas"></canvas>

  <h3>Your Photo</h3>
  <img id="photo" alt="Your captured photo">

  <br>
  <button id="saveBtn" onclick="savePhoto()" disabled>
    💾 Save Photo
  </button>

  <script>
    let stream;
    let photoData = "";

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        document.getElementById("video").srcObject = stream;
      } catch (err) {
        alert("Please allow camera permission.");
      }
    }

    function takePhoto() {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");

      if (!stream || video.videoWidth === 0) {
        alert("Please open the camera first.");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);

      photoData = canvas.toDataURL("image/jpeg", 0.95);

      const photo = document.getElementById("photo");
      photo.src = photoData;
      photo.style.display = "block";

      document.getElementById("saveBtn").disabled = false;
    }

    function savePhoto() {
      if (!photoData) return;

      const link = document.createElement("a");
      link.href = photoData;
      link.download = "my-photo.jpg";
      link.click();
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        document.getElementById("video").srcObject = null;
      }
    }
  </script>
</body>
</html>
